<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Mini Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Шапка: Балансы -->
        <header class="header">
            <div class="balance-card">
                <span class="bal-icon">⭐</span>
                <span id="stars-balance">1000</span>
            </div>
            <div class="balance-card">
                <span class="bal-icon">💎</span>
                <span id="ton-balance">10.0</span>
            </div>
        </header>

        <!-- Переключатель игр -->
        <nav class="game-nav">
            <button class="nav-btn active" onclick="switchGame('coin')">🪙 Монетка</button>
            <button class="nav-btn" onclick="switchGame('slots')">🎰 Слоты</button>
            <button class="nav-btn" onclick="switchGame('mines')">💣 Мины</button>
            <button class="nav-btn" onclick="switchGame('ring')">🎯 Кольцо</button>
        </nav>

        <!-- ВЫБОР ВАЛЮТЫ И СТАВКИ -->
        <div class="bet-section">
            <div class="currency-toggle">
                <button id="curr-stars" class="curr-btn active" onclick="setCurrency('STARS')">⭐ Stars</button>
                <button id="curr-ton" class="curr-btn" onclick="setCurrency('TON')">💎 TON</button>
            </div>
            <div class="bet-input-box">
                <button class="step-btn" onclick="changeBet(-5)">-</button>
                <input type="number" id="bet-amount" value="10" min="1" oninput="updateRingBetDisplay()">
                <span id="curr-icon-label">⭐</span>
                <button class="step-btn" onclick="changeBet(5)">+</button>
            </div>
        </div>

        <!-- ИГРА 1: МОНЕТКА -->
        <main id="game-coin" class="game-screen">
            <div class="coin-history-bar">
                <span class="history-label">История:</span>
                <div class="history-chips" id="coin-history">
                    <span class="chip">🦅</span>
                    <span class="chip">👑</span>
                    <span class="chip">🪙</span>
                </div>
            </div>

            <div class="arena">
                <div id="coin-display" class="coin-display">🪙</div>
                <div class="clown-avatar">🤡</div>
            </div>
            <div id="coin-status" class="status-msg">Сделай ставку!</div>
            <div class="coin-buttons">
                <button class="action-btn" onclick="playCoin('eagle')">🦅 Орёл (x2)</button>
                <button class="action-btn" onclick="playCoin('edge')">🪙 Ребро (x5)</button>
                <button class="action-btn" onclick="playCoin('tails')">👑 Решка (x2)</button>
            </div>
        </main>

        <!-- ИГРА 2: СЛОТЫ -->
        <main id="game-slots" class="game-screen hidden">
            <div class="slots-container">
                <div class="slot-reel" id="reel1">7️⃣</div>
                <div class="slot-reel" id="reel2">7️⃣</div>
                <div class="slot-reel" id="reel3">7️⃣</div>
            </div>
            <div id="slots-status" class="status-msg">Выигрыш только при 3 одинаковых!</div>
            <button class="action-btn spin-btn" onclick="playSlots()">🎰 КРУТИТЬ</button>
        </main>

        <!-- ИГРА 3: МИНЫ (7x7) -->
        <main id="game-mines" class="game-screen hidden">
            <div class="mines-settings">
                <span>Количество мин:</span>
                <div class="mines-count-selector">
                    <button class="step-btn" onclick="changeMinesCount(-1)">-</button>
                    <input type="number" id="mines-count-input" value="3" readonly>
                    <button class="step-btn" onclick="changeMinesCount(1)">+</button>
                </div>
            </div>

            <div id="mines-status" class="status-msg">Выбери количество мин и начни игру!</div>

            <div class="mines-grid-7x7" id="mines-grid"></div>

            <button id="mines-action-btn" class="action-btn spin-btn" onclick="handleMinesBtn()">🚀 Начать игру</button>
        </main>

        <!-- ИГРА 4: РУЛЕТКА-КОЛЬЦО -->
        <main id="game-ring" class="game-screen hidden">
            <div id="ring-status" class="status-msg">Выбери коэффициент и сделай ставку!</div>

            <div class="ring-roulette-wrapper">
                <div class="ring-pointer">▼</div>
                <div class="ring-wheel" id="ring-wheel">
                    <svg viewBox="0 0 200 200" class="ring-svg">
                        <circle id="win-sector-ring" cx="100" cy="100" r="70" fill="none" stroke="#2563eb" stroke-width="32" stroke-dasharray="380 60" />
                        <circle id="lose-sector-ring" cx="100" cy="100" r="70" fill="none" stroke="#1e293b" stroke-width="32" stroke-dasharray="60 380" stroke-dashoffset="-380" />
                    </svg>
                    <div class="ring-center">
                        <div id="ring-win-amount" class="ring-win-amount">+11.0⭐</div>
                        <div id="ring-mult-text" class="ring-multiplier">1.1x</div>
                        <div class="no-loot-label">NO LOOT</div>
                    </div>
                </div>
            </div>

            <div class="multiplier-selector">
                <button class="mult-btn active" onclick="setRingMultiplier(1.1, this)">1.1x</button>
                <button class="mult-btn" onclick="setRingMultiplier(2, this)">2x</button>
                <button class="mult-btn" onclick="setRingMultiplier(3, this)">3x</button>
                <button class="mult-btn" onclick="setRingMultiplier(5, this)">5x</button>
                <button class="mult-btn" onclick="setRingMultiplier(7, this)">7x</button>
                <button class="mult-btn" onclick="setRingMultiplier(10, this)">10x</button>
            </div>

            <button id="ring-spin-btn" class="action-btn spin-btn" onclick="playRingRoulette()">Ставка <span id="ring-btn-amount">10⭐</span></button>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
