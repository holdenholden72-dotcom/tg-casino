<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlotCasino</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ С БАЛАНСОМ -->
    <header class="app-header">
        <div class="balance-card">
            <span class="icon">⭐</span>
            <span id="stars-balance">0</span>
        </div>
        <div class="balance-card">
            <span class="icon">💎</span>
            <span id="ton-balance">0.00</span>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ (ВКЛАДКИ) -->
    <main class="content">
        
        <!-- ВКЛАДКА 1: ИГРЫ -->
        <div id="tab-games" class="tab-content active">
            
            <div class="games-nav-bar">
                <button class="g-nav-btn active" onclick="switchGame('coin', this)">🪙 Монетка</button>
                <button class="g-nav-btn" onclick="switchGame('slots', this)">🎰 Слоты</button>
                <button class="g-nav-btn" onclick="switchGame('mines', this)">💣 Мины</button>
                <button class="g-nav-btn" onclick="switchGame('wheel', this)">🎯 Колесо</button>
            </div>

            <!-- ПАНЕЛЬ СТАВОК -->
            <div class="bet-panel-container">
                <div class="currency-tabs">
                    <button class="curr-tab-btn active" onclick="setGameCurrency('STARS', this)">⭐ Stars</button>
                    <button class="curr-tab-btn" onclick="setGameCurrency('TON', this)">💎 TON</button>
                </div>
                <div class="bet-input-row">
                    <button class="bet-control-btn" onclick="changeBet(-1)">-</button>
                    <input type="number" id="current-bet-input" value="10" min="1">
                    <button class="bet-control-btn" onclick="changeBet(1)">+</button>
                    <span id="bet-currency-icon">⭐</span>
                </div>
            </div>

            <!-- ИГРА 1: МОНЕТКА -->
            <div id="game-coin" class="sub-game-screen active">
                <div class="game-history" id="coin-history">История: 🦅 👑 🪙</div>
                <div class="coin-visual-box">
                    <div class="coin-flipper" id="coin-flipper">
                        <div class="coin-side coin-front">🪙</div>
                    </div>
                </div>
                <div class="coin-action-buttons">
                    <button class="action-btn" onclick="playCoin('eagle')">🦅 Орёл (x2)</button>
                    <button class="action-btn" onclick="playCoin('edge')">🪙 Ребро (x5)</button>
                    <button class="action-btn" onclick="playCoin('tails')">👑 Решка (x2)</button>
                </div>
            </div>

            <!-- ИГРА 2: СЛОТЫ -->
            <div id="game-slots" class="sub-game-screen">
                <div class="slots-window">
                    <div class="slot-reel" id="reel-1">🍒</div>
                    <div class="slot-reel" id="reel-2">🍋</div>
                    <div class="slot-reel" id="reel-3">🍇</div>
                </div>
                <p class="game-hint">Соберите 3 одинаковых фрукта!</p>
                <button class="action-btn" onclick="playSlots()">🎰 КРУТИТЬ</button>
            </div>

            <!-- ИГРА 3: МИНЫ (7x7) -->
            <div id="game-mines" class="sub-game-screen">
                <div class="mines-settings">
                    <span>Мины: <b id="mines-count">5</b></span>
                    <div class="mines-stepper">
                        <button onclick="changeMines(-1)">-</button>
                        <button onclick="changeMines(1)">+</button>
                    </div>
                </div>
                <div class="mines-grid-7x7" id="mines-grid"></div>
                <button class="action-btn" id="mines-action-btn" onclick="startMinesGame()">🚀 Начать игру</button>
            </div>

            <!-- ИГРА 4: КОЛЕСО -->
            <div id="game-wheel" class="sub-game-screen">
                <p class="game-hint">Выбери коэффициент и крути колесо!</p>
                <div class="wheel-container-v2">
                    <div class="wheel-pointer-v2"></div>
                    <div class="wheel-circle-v2" id="wheel-element">
                        <div class="wheel-center-v2">
                            <span id="wheel-center-val">🎯</span>
                            <span class="wheel-sub-val" id="wheel-sub-text">1.1x</span>
                        </div>
                    </div>
                </div>
                <div class="multiplier-row">
                    <button class="mult-btn active" onclick="setMultiplier(1.1, 280, this)">1.1x</button>
                    <button class="mult-btn" onclick="setMultiplier(2, 220, this)">2x</button>
                    <button class="mult-btn" onclick="setMultiplier(3, 160, this)">3x</button>
                    <button class="mult-btn" onclick="setMultiplier(5, 100, this)">5x</button>
                    <button class="mult-btn" onclick="setMultiplier(7, 60, this)">7x</button>
                    <button class="mult-btn" onclick="setMultiplier(10, 30, this)">10x</button>
                </div>
                <button class="action-btn" onclick="spinWheel()">Крутить <span id="wheel-btn-val">10</span> ⭐</button>
            </div>

        </div>

        <!-- ВКЛАДКА 2: ПОПОЛНЕНИЕ -->
        <div id="tab-deposit" class="tab-content">
            <h1 class="page-title">Пополнение</h1>
            <div class="card-section">
                <p>Выберите способ пополнения:</p>
                <button class="action-btn" onclick="buyStars(100)">Пополнить 100 ⭐</button>
                <button class="action-btn" onclick="depositTon()">Пополнить 💎 (TON)</button>
            </div>
        </div>

        <!-- ВКЛАДКА 3: ВЫВОД -->
        <div id="tab-withdraw" class="tab-content">
            <h1 class="page-title">Вывод средств</h1>
            <div class="card-section">
                <p>Доступно: <span id="withdraw-stars">0</span> ⭐ / <span id="withdraw-ton">0.00</span> 💎</p>
                <input type="number" id="withdraw-amount" placeholder="Сумма для вывода">
                <button class="action-btn" onclick="withdrawFunds()">Запросить вывод</button>
            </div>
        </div>

        <!-- ВКЛАДКА 4: ПРОМОКОД -->
        <div id="tab-promo" class="tab-content">
            <h1 class="page-title">Промокод</h1>
            <div class="card-section">
                <p>Введите бонусный промокод:</p>
                <input type="text" id="promo-input" placeholder="PROMOCODE">
                <button class="action-btn" onclick="activatePromo()">Активировать</button>
            </div>
        </div>

    </main>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('games', this)"><span>🎮</span> Игры</button>
        <button class="nav-item" onclick="switchTab('deposit', this)"><span>➕</span> Пополнение</button>
        <button class="nav-item" onclick="switchTab('withdraw', this)"><span>📤</span> Вывод</button>
        <button class="nav-item" onclick="switchTab('promo', this)"><span>🎁</span> Промокод</button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
