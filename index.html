<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Casino</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- Шапка с балансом -->
    <header class="header">
        <div class="balance-container">
            <span id="stars-balance">0</span> ⭐
            <span id="ton-balance">0.0</span> 💎
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ (ВКЛАДКИ) -->
    <main class="content">
        
        <!-- Вкладка 1: Игры (Сетка квадратиками) -->
        <div id="tab-games" class="tab-content active">
            <h1 class="page-title">Игры</h1>
           <!-- Вкладка 1: Игры (Сетка квадратиками) -->
        <div id="tab-games" class="tab-content active">
            <h1 class="page-title">Игры</h1>
            <div class="games-grid">
                <!-- Карточка игры 1: Колесо -->
                <div class="game-card" onclick="openGame('wheel')">
                    <div class="game-icon">🎡</div>
                    <h2>Wheel</h2>
                    <span class="game-max">мин. 1 ⭐ / 0.1 💎</span>
                </div>

                <!-- Карточка игры 2: Мины -->
                <div class="game-card" onclick="openGame('mines')">
                    <div class="game-icon">💣</div>
                    <h2>Mines</h2>
                    <span class="game-max">Скоро</span>
                </div>

                <!-- Карточка игры 3: Краш (НОВАЯ) -->
                <div class="game-card" onclick="openGame('crash')">
                    <div class="game-icon">🚀</div>
                    <h2>Crash</h2>
                    <span class="game-max">Скоро</span>
                </div>

                <!-- Карточка игры 4: Слот (НОВАЯ) -->
                <div class="game-card" onclick="openGame('slots')">
                    <div class="game-icon">🎰</div>
                    <h2>Slots</h2>
                    <span class="game-max">Скоро</span>
                </div>
            </div>
        </div>
        <!-- Вкладка 2: Пополнение -->
        <div id="tab-deposit" class="tab-content">
            <h1 class="page-title">Пополнение</h1>
            <div class="card-section">
                <p>Выберите способ пополнения:</p>
                <button class="action-btn" onclick="buyStars(100)">Пополнить 100 ⭐</button>
                <button class="action-btn" onclick="depositTon()">Пополнить TON 💎</button>
            </div>
        </div>

        <!-- Вкладка 3: Вывод -->
        <div id="tab-withdraw" class="tab-content">
            <h1 class="page-title">Вывод средств</h1>
            <div class="card-section">
                <p>Введите сумму для вывода:</p>
                <input type="number" id="withdraw-amount" placeholder="Сумма">
                <button class="action-btn" onclick="withdraw()">Вывести</button>
            </div>
        </div>

    </main>

    <!-- НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ (3 вкладки) -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('games', this)">
            <span class="nav-icon">🎮</span>
            <span>Игры</span>
        </button>
        <button class="nav-item" onclick="switchTab('deposit', this)">
            <span class="nav-icon">📥</span>
            <span>Пополнение</span>
        </button>
        <button class="nav-item" onclick="switchTab('withdraw', this)">
            <span class="nav-icon">📤</span>
            <span>Вывод</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
